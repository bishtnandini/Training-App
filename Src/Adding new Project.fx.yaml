                DisplayMode.Disabled,                
                DisplayMode.Edit                     
            )
        Height: =70
        OnSelect: |
            =Set(
                varProject,
                Patch(
                    Projects,
                    Defaults(Projects),
                    {
                       
                        'Project Name': DataCardValue12_2.Text,
                        Description: DataCardValue12_3.Text,
                        'Start Date': DatePicker1.SelectedDate,
                        'End Date': DatePicker2.SelectedDate,
                        Priority: ComboBox1.Selected.Value,
                        'Status (cr371_status)': ComboBox2_2.Selected.Value,
                        'Assigned Manager': ComboBox2_1.Selected
                    }
                )
            );
            
            
            If(
                !IsBlank(varProject),
                Patch(
                    ProjectAssignmentsses,
                    Defaults(ProjectAssignmentsses),{
                        Name: LookUp(TeamMembers, Name = ComboBox2_1.Selected.Name), // Ensure correct lookup structure
                        ProjectId: LookUp(Projects, ProjectId = varProject.ProjectId), // Ensure correct project lookup
                        Role: "Manager"
            
                    }
                
                )
            );
            
            
            
