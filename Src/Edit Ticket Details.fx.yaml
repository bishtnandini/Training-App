    Button5_1 As button:
        Fill: =RGBA(9, 33, 98, 1)
        Height: =70
        OnSelect: |+
            =Set(
                VarTicket,
                Patch(
                    Tickets,
                    LookUp(Tickets ,TickID=Gallery2.Selected.TickID),
                    {
                        Title: DataCardValue12_13.Text,
                        Description: DataCardValue12_14.Text,
                        Priority: Dropdown1_4.Selected.Value,
                        'Status (cr371_status)': Dropdown1_7.Selected.Value,
                        'Assign To':LookUp(TeamMembers,Name=Dropdown1_6.Selected.Name),
                        'Created By (cr371_CreatedBy)': LookUp(TeamMembers,Name=varLoggedInUser.Name)
                    }
                )
            );
            Navigate(
                'Ticket details are displayed to the employee',
                ScreenTransition.Cover
            );
            
