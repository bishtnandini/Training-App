    Button4_1 As button:
        DisplayMode: |
            =
            If(
                   
                IsBlank(DataCardValue12_2.Text) ||    
                IsBlank(DatePicker2.SelectedDate) ||  
                IsBlank(ComboBox1.SelectedItems) ||  
                               
                DisplayMode.Disabled,                
                DisplayMode.Edit                     
            )
        Height: =70
        OnSelect: |
            =Set(
                varUpProject,
                Patch(
                    Projects,
                    LookUp(
                        Projects,
                        ProjectId = Gallery4.Selected.ProjectId
                    ),
                    {
                        'Project Name': DataCardValue12_11.Text,
                        Description:DataCardValue12_12.Text,
                        'Start Date':DatePicker1_1.SelectedDate,
                        'End Date':DatePicker2_2.SelectedDate,
                        Priority:ComboBox1_1.Selected.Value,
                        'Status (cr371_status)':ComboBox2_5.Selected.Value,
                        'Assigned Manager':ComboBox2_4.Selected
                    
                    }
                )
            );
            
            
            If(
                !IsBlank(varUpProject),
                Patch(
                    ProjectAssignmentsses,
                    LookUp(
                        ProjectAssignmentsses,
                        ProjectId.ProjectId = Gallery4.Selected.ProjectId
                    ),
                    {
                        
                        Name:ComboBox2_4.Selected
                    
                    }
                
                )
            );
            
            
            
            Navigate('Admin Dashboard',ScreenTransition.Cover);
            Reset(DataCardValue12_2);
            Reset(DataCardValue12_3);
            Reset(DatePicker1);
            Reset(DatePicker2);
            Reset(ComboBox1);
            Reset(ComboBox2_2);
            Reset(ComboBox2_1);
            
            
            /*If(
                !IsBlank(varProject),
                Patch(
