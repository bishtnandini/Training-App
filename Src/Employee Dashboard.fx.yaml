            OnSelect: =Select(Parent)
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =23
            Text: |+
                =LookUp(Projects, ProjectId = ThisItem.ProjectId.ProjectId, 'Project Name')
                
