    "Gallery1 As gallery.'BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0'":
        DelayItemLoading: =true
        Height: =593
        Items: |-
            =Sort(Filter(
                If(
                    IsBlank(ComboBox3.Selected.Value), 
                    Filter(Tasks, AssignedTo.Name = varLoggedInUser.Name),  
                    Filter(Tasks, AssignedTo.Name = varLoggedInUser.Name, Priority = ComboBox3.Selected.Value)
                ),
                TextInput2_2.Text in ProjectId.'Project Name'  // Access project name from lookup field
            )
            ,
            Priority)
        Layout: =Layout.Vertical
        LoadingSpinner: =LoadingSpinner.Data
        OnSelect: =Navigate('Task Detail Screen',ScreenTransition.UnCoverRight)
        TemplatePadding: =0
        TemplateSize: =190
        Width: =593
        X: =22
        Y: =193
        ZIndex: =16

        Title1 As label:
            FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Semibold)
