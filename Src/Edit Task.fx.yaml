    Button3_1 As button:
        DisplayMode: =If(IsBlank(DataCardValue12_16.Text)|| IsBlank(Dropdown3_3.Selected) || IsBlank(DatePicker2_3.SelectedDate) ,DisplayMode.Disabled,DisplayMode.Edit)
        Fill: =RGBA(9, 33, 98, 1)
        FontWeight: =FontWeight.Bold
        Height: =70
        OnSelect: |+
            =
            Set(
                VarUpTask,
                Patch(
                    Tasks,
                    LookUp(
                        Tasks,
                        TID = Gallery7.Selected.TID
                    ),
                    {
                       Description:DataCardValue12_16.Text,
                       Deadline:DatePicker2_3.SelectedDate,
                       Priority:Dropdown3_3.Selected.Value,
                       AssignedTo: LookUp(TeamMembers, Name = Dropdown3_4.Selected.cr371_empid),
                       'Status (cr371_status)':Dropdown3_5.Selected.Value
                    }
                )
            );
            
            Navigate('View all Assigned Tasks',ScreenTransition.UnCoverRight);
            Reset(Dropdown3_5);
            Reset(DatePicker2_3);
            Reset(Dropdown3_4);
            Reset(DataCardValue12_16);
            Reset(Dropdown3_3);
            
            
            
            
            
