"'Project Details' As screen":
    OnVisible: |+
        =UpdateContext({
            taskCompletion: With(
                {
                    totalTasks: CountRows(Filter(Tasks, ProjectId.ProjectId =Gallery6.Selected.ProjectId )),
                    completedTasks: CountRows(Filter(Tasks, ProjectId.ProjectId = Gallery6.Selected.ProjectId && Gallery6.Selected.'Status (cr371_status)' = 852020002))
                },
                If(totalTasks > 0, Round((completedTasks / totalTasks) * 100, 2)& "%", "0%" )
            )
        })
        

