    "Gallery8 As gallery.'BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0'":
        DelayItemLoading: =true
        Height: =427
        Items: =Filter(Comments, TaskID.TID=Gallery1.Selected.TID && 'Assigned To'.Name=varLoggedInUser.Name)
        Layout: =Layout.Vertical
        LoadingSpinner: =LoadingSpinner.Data
        TemplatePadding: =0
        TemplateSize: =115
        Width: =605
        X: =35
        Y: =631
        ZIndex: =29

        Title7 As label:
            FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
            Height: =Self.Size * 1.8
            OnSelect: =Select(Parent)
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =21
            Text: =ThisItem.'Comment Name'
            VerticalAlign: =VerticalAlign.Top
            Width: =Parent.TemplateWidth - 173
            X: =24
            Y: =12
            ZIndex: =2

        Subtitle7 As label:
            FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
            Height: =Self.Size * 1.8
            OnSelect: =Select(Parent)
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =20
            Text: |-
                ="Description : " & ThisItem.'Comment Description'
            VerticalAlign: =VerticalAlign.Top
            Width: =Title7.Width
            X: =Title7.X
            Y: =59
            ZIndex: =3

        Separator7 As rectangle:
            Height: =8
            OnSelect: =Select(Parent)
            Width: =Parent.TemplateWidth
            Y: =Parent.TemplateHeight - Self.Height
            ZIndex: =5

        Rectangle10 As rectangle:
            Height: =Parent.TemplateHeight - Separator7.Height
            OnSelect: =Select(Parent)
            Visible: =ThisItem.IsSelected
            Width: =4
            ZIndex: =6

    Icon38 As icon.Add:
