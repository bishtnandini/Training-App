                  VerticalAlign: =VerticalAlign.Top
                  Width: =182
                  X: =103
                  Y: =119
            - Icon34:
                Control: Classic/Icon@2.5.0
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =RGBA(0, 18, 107, 1)
                  Height: =54
                  Icon: =Icon.Post
                  OnSelect: =Select(Parent)
                  Width: =53
                  X: =32
                  Y: =110
            - Icon35:
                Control: Classic/Icon@2.5.0
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =If(Icon.Export , RGBA(178, 222, 39,1),RGBA(246, 88, 16, 1))
                  Height: =54
                  Icon: |-
                    =//Icon.Export

                    If(
                        !IsBlank(ThisItem.AssignedTo.Name),  // Check if the Name field inside the 'Assigned To' Lookup is not blank
                    Icon.CheckBadge,  // Show cancel icon if assigned
                        Icon.Export  // Show export icon if not assigned
                    )
                  OnSelect: |-
                    =Patch(
                        FeedBacks,
                        LookUp(
                            FeedBacks,
                            'Issue Name' = Gallery5.Selected.'Issue Name'
                        ),
                        {
                            AssignedTo: LookUp(
                                TeamMembers,
                                Department = Text(Gallery5.Selected.Dep) && Role = "Manager"
                            )
                        }
                    );
                    Notify(
                        "The feedback has been successfully sent to the manager",
                        NotificationType.Success
                    );
                    /*Patch(
                        TeamMembers,
                        LookUp(
                            TeamMembers,
                            Department = Gallery5.Selected.Department && Role="Manager"
                        ),
                        {
                            'Feedback Assigned To ID': LookUp(
                                FeedBacks,
                                FBID = Gallery5.Selected.FBID
                            )
                        }
                    );*/
                  Width: =53
                  X: =511
                  Y: =61
