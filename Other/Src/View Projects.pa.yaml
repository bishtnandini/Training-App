Screens:
  View Projects:
    Properties:
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |+
        =UpdateContext({
            taskCompletion: With(
                {
                    totalTasks: CountRows(Filter(Tasks, ProjectId.ProjectId =Gallery4.Selected.ProjectId )),
                    completedTasks: CountRows(Filter(Tasks, ProjectId.ProjectId = Gallery4.Selected.ProjectId && Gallery4.Selected.'Status (cr371_status)' = 852020002))
                },
                If(totalTasks > 0, Round((completedTasks / totalTasks) * 100, 2)& "%", "0%" )
            )
        })

    Children:
