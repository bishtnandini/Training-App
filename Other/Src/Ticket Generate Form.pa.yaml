      - Button5:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            DisplayMode: |-
              =If(
                  IsBlank(DataCardValue12_4.Text) ||  IsBlank(DataCardValue12_5.Text) || IsBlank(Dropdown1.Selected.Value) ||IsBlank(Dropdown1_3.Selected.Value),
                  DisplayMode.Disabled,
                  DisplayMode.Edit
              )
            Fill: =RGBA(9, 33, 98, 1)
            Font: =Font.'Open Sans'
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            OnSelect: |-
              =Set(
                  VarTicket,
                  Patch(
                      Tickets,
                      Defaults(Tickets),
                      {
                          Title: DataCardValue12_4.Text,
                          Description: DataCardValue12_5.Text,
                          Priority: Dropdown1.Selected.Value,
                          'Status (cr371_status)': Dropdown1_2.Selected.Value,
                          'Assign To': LookUp(TeamMembers,Name=Dropdown1_1.Selected.Name),
                          'Created By (cr371_CreatedBy)': LookUp(TeamMembers,Name=varLoggedInUser.Name),
                          Department:Dropdown1_3.Selected.Value
                      }
                  )
              );
              Navigate(
                  'Employee Dashboard',
                  ScreenTransition.Cover
              );
              Reset(DataCardValue12_4);
              Reset(DataCardValue12_5);
              Reset(Dropdown1);
              Reset(Dropdown1_2);
              Reset(Dropdown1_1);
