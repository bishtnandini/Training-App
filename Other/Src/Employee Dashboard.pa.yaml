            Height: =593
            Items: |-
              =Sort(Filter(
                  If(
                      IsBlank(ComboBox3.Selected.Value), 
                      Filter(Tasks, AssignedTo.Name = varLoggedInUser.Name),  
                      Filter(Tasks, AssignedTo.Name = varLoggedInUser.Name, Priority = ComboBox3.Selected.Value)
                  ),
                  TextInput2_2.Text in ProjectId.'Project Name'  // Access project name from lookup field
              )
              ,
              Priority)
            OnSelect: =Navigate('Task Detail Screen',ScreenTransition.UnCoverRight)
            TemplateSize: =190
            Width: =593
            X: =22
            Y: =193
          Children:
            - Title1:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 1)
                  Color: =RGBA(50, 49, 48, 1)
                  Font: =Font.'Open Sans'
                  FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Semibold)
                  Height: =Self.Size * 1.8
                  OnSelect: =Select(Parent)
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =23
                  Text: |+
                    =LookUp(Projects, ProjectId = ThisItem.ProjectId.ProjectId, 'Project Name')

                  VerticalAlign: =VerticalAlign.Top
                  Width: =Parent.TemplateWidth - 173
                  X: =20
                  Y: =12
            - Subtitle1:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 1)
                  Font: =Font.'Open Sans'
                  FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
                  Height: =40
                  OnSelect: =Select(Parent)
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =20
                  Text: |-
                    = "Task Description : "& ThisItem.Description
                  VerticalAlign: =VerticalAlign.Top
                  Width: =Title1.Width
                  X: =Title1.X
                  Y: =69
            - Separator1:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Fill: =RGBA(255, 255, 255, 1)
                  Height: =8
                  OnSelect: =Select(Parent)
                  Width: =Parent.TemplateWidth
                  Y: =Parent.TemplateHeight - Self.Height
