                  DisplayMode.Disabled,
                  DisplayMode.Edit
              )
            Fill: =RGBA(9, 33, 98, 1)
            Font: =Font.'Open Sans'
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            OnSelect: "=Set(\n    varLoggedInUser,\n    LookUp(\n        TeamMembers,\n        Email = TextInput4.Text && Password = TextInput4_1.Text\n    )\n);\nSet(\n    UserRole,\n    varLoggedInUser.Role\n);\n\nSet(\n    UserProjectId,\n    LookUp(\n        ProjectAssignmentsses,\n        Name.Name = varLoggedInUser.Name,ProjectId.ProjectId\n    )\n    \n);\n\n\nIf(\n    IsBlankOrError(varLoggedInUser),\n    Notify(\"Incorrect Email Or Password\");\n    Set(\n        lblxt,\n        true\n    ),\n    Switch(\n        UserRole,\n        \"Manager\",\n        Navigate(\n            'Manager Dashboard',\n            ScreenTransition.CoverRight\n        ),\n        \"Admin\",\n        Navigate(\n            'Admin Dashboard',\n            ScreenTransition.UnCover\n        ),\n        \"Employee\",\n        Navigate('Employee Dashboard')\n    )\n);\nReset(TextInput4);\nReset(TextInput4_1);\n"
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Text: ="LogIn"
